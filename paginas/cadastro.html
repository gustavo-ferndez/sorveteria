<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADASTRO - Sorveteria</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Boldonse&family=Luckiest+Guy&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Rambla:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar">
            <div>
                <a class="logo" href="../index.html">SORVETERIA</a>
            </div>
            <div>
                <div class="carrinho"></div>
                <ul class="list-link">
                    <li>
                        <a class="link-nav" href="login.html">LOGIN</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>
    <main class="box-cadastro">
        <section class="sorv-cdt">
            <img src="../img/sorvete_cadastro.jpg" alt="Sorvete">
        </section>
        <section class="container-cadastro">
            <h2 id="titulo-login">Cadastro</h2>
            <form class="form-login">
                <div class="campo-cadastro">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                </div>
                <div class="campo-cadastro">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="exemplo@gmail.com" required>
                </div>
                <div class="campo-cadastro">
                    <label for="tel">Telefone:</label>
                    <input type="tel" id="tel" name="telefone" placeholder="(11) 99999-9999" required>
                </div>
                <div class="campo-cadastro">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF" required>
                </div>
                <div class="campo-cadastro">
                    <label for="password">Senha:</label>
                    <input type="password" id="password" name="senha" placeholder="Digite sua senha" required>
                </div>
                
                <div class="botao-form">
                    <button type="submit" class="btn botao-login">Registre-se</button>
                </div>
                
            </form>
        </section>
    </main>
    <footer>
        <div class="paginas-footer">
            <a href="../index.html">Home</a>
            <a href="produto.html">Produtos</a>
            <a href="login.html">Login</a>
        </div>
        <div class="contato-footer">
            <h4>E-mail: sorveteria@gmail.com</h4>
            <h4>Telefone: (11) 99999-9999</h4>
        </div>
    </footer>
</body>
</html>
